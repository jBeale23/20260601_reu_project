# Hooks are chosen to run without Docker. The shfmt and shellcheck hooks used to be the
# `-docker` variants, which cannot run at all on a machine without a Docker daemon (a
# plain WSL2 install, for one) - the hook did not fail, it errored out, so shell scripts
# went unchecked locally and were only caught in CI.
#
# Keep the ruff rev in step with .github/workflows/ruff.yaml. When the two drift, a commit
# passes every local check and still fails CI on a rule the newer ruff added.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt-src

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
