name: Ruff

on:
  workflow_call:

jobs:
  ruff:
    name: Lint and Format with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Pinned, and kept in step with .pre-commit-config.yaml. Left unpinned this action
      # installs the newest release, so a rule added upstream fails CI on a commit that
      # passed every local check.
      - name: Install Ruff
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.16.2"
          args: "--version"

      - name: Ruff Check
        run: ruff check --no-fix

      - name: Ruff Format
        run: ruff format --check --diff
